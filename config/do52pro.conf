CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_BT_CTLR_TX_PWR_MINUS_8=y

CONFIG_ZMK_DISPLAY=n

# Mouse pointer support (native ZMK 0.3 pointing subsystem).
# The PS/2 TrackPoint driver itself is enabled automatically on the right
# side by its devicetree nodes (modules/trackpoint).
CONFIG_ZMK_POINTING=y
